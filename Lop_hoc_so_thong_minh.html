.btn.mint{background:linear-gradient(110deg,#03ad9d,#21c9b7);color:white;box-shadow:0 7px 17px #1dc6b42d}.btn.pink{background:linear-gradient(110deg,#f44c9d,#eb73b2);color:white}.btn.secondary{background:#fff;color:#633d9e;border:1px solid #ddc7fd;box-shadow:0 3px 10px #b390e21f}.btn.secondary:hover{background:#f9f3ff}.btn.danger{color:#b44661;background:#fff0f4}.btn.ghost{color:#8052b6;background:#f4eaff}
.card{border:1px solid #efe0ff;box-shadow:var(--shadow);border-radius:21px;background:rgba(255,255,255,.97)}.card h2{font-size:19px;color:#543684}.card h3{font-size:17px}
.stat{border:1px solid transparent;box-shadow:0 9px 23px #765ec421;min-height:145px}.stat:nth-child(1){background:linear-gradient(135deg,#efe0ff,#fff)}.stat:nth-child(2){background:linear-gradient(135deg,#d9fff3,#fff)}.stat:nth-child(3){background:linear-gradient(135deg,#ffecd9,#fff)}.stat:nth-child(4){background:linear-gradient(135deg,#ffe0f0,#fff)}.stat-number{color:#6333aa;font-size:32px}.stat-label{color:#6e578f;font-size:14px}.stat-meta{color:#907fa4;font-size:13px}
.quick{background:linear-gradient(145deg,#fff,#faf5ff);border-color:#e9dafa;color:#5d4387;font-size:14px}.quick:hover{border-color:#c48bf8;box-shadow:0 8px 24px #b37ce82e}.quick-ico{background:#eee0ff!important;color:#672fc1}.quick:nth-child(2) .quick-ico{background:#d5faea!important}.quick:nth-child(3) .quick-ico{background:#ffeac9!important}.quick:nth-child(4) .quick-ico{background:#ffe0f0!important}
.data-table th{background:#f0e6ff;color:#6b44a0;font-size:13px;letter-spacing:0;text-transform:none}.data-table td{font-size:14px;color:#574b79}.student-name{color:#49316e}.class-card{border:1px solid #eedcfa;background:linear-gradient(155deg,#fff,#fbf8ff);box-shadow:var(--shadow)}.class-card h3{color:#533386}.class-card p{font-size:13px}
label{color:#664b92;font-size:14px}input,select,textarea{font-size:15px;border-color:#e4d4f1}.tip{font-size:13px}.empty{border-color:#d2b4fe;border-width:2px;background:linear-gradient(145deg,#fff,#fdf6ff);box-shadow:0 8px 30px #ab87dd18}.empty h2{color:#633fa2}.empty p{font-size:15px;color:#80749d}
.picker-stage{background:radial-gradient(circle at 50% 12%,#fff 0%,#f0dfff 41%,#d9fff1 100%);border-color:#c79bf2}.picker-display{color:#633299}.suggestion{background:#fcf7ff;color:#504272;font-size:15px}.report-pill{background:linear-gradient(135deg,#f1e4ff,#fff7ff)}.report-pill strong{color:#7439bf}.tag{font-size:12px}.footer-note{color:#8c69ac;font-size:12px;font-weight:bold}

.cover-board{margin-bottom:25px;border-radius:27px;overflow:hidden;border:1px solid #e7d0fc;box-shadow:0 15px 45px rgba(109,59,179,.16);background:#fff}
.cover-title-strip{background:linear-gradient(105deg,#803de8 0%,#bf46de 37%,#ee5598 71%,#ff9b49 100%);color:#fff;min-height:95px;padding:18px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;overflow:hidden}
.cover-title-strip:before{content:"✦  ✧  ★";position:absolute;right:27%;font-size:45px;opacity:.13;top:10px;letter-spacing:25px;pointer-events:none}
.cover-title-strip h2{color:#fff;font-size:clamp(21px,2.4vw,30px);margin:0 0 5px;line-height:1.12;text-shadow:0 2px 3px #4c188633}.cover-title-strip p{margin:0;color:#fffbe6;font-size:15px}
.cover-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.cover-controls button{border:1px solid #ffffff9d;background:#fff;color:#7a39b1;font-family:"Times New Roman",Times,serif;font-size:14px;font-weight:bold;border-radius:11px;padding:10px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 5px 15px #7631ab34}
.cover-controls button.remove{color:white;background:#ffffff2e}
.cover-photo-scene{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(115deg,#ecdfff,#f7efff 40%,#dcfff8);padding:10px;min-height:250px}
.cover-photo-scene.dragging{outline:5px dashed #f159ae;outline-offset:-12px;filter:saturate(1.15)}.cover-photo-scene.with-image{background:linear-gradient(125deg,#caaaff,#ffdeed,#b5f8ee);padding:14px 20px}
.cover-photo-scene img{display:block;width:100%;height:auto;max-height:460px;object-fit:contain;object-position:center;border-radius:10px;box-shadow:0 8px 23px #5a3a9e28;background:#fff}
.cover-default{width:100%;min-height:240px;display:flex;gap:26px;align-items:center;justify-content:center;background:radial-gradient(circle at 17% 27%,#ffe171 0 10%,transparent 10.5%),radial-gradient(circle at 82% 77%,#ffc9e6 0 15%,transparent 15.4%),linear-gradient(115deg,#f8e9ff,#e4faff);border-radius:17px;position:relative;padding:20px}
.cover-default:before{content:"🌈";font-size:50px;position:absolute;top:12px;right:35px;animation:float 4s ease-in-out infinite}
.cover-main-emoji{font-size:clamp(65px,10vw,126px);filter:drop-shadow(0 14px 15px #8d58a43d);animation:float 5s ease-in-out infinite}
.cover-default-copy{max-width:430px;color:#58338c}.cover-default-copy strong{display:block;font-size:clamp(24px,3vw,38px);line-height:1.2}.cover-default-copy span{display:block;font-size:19px;color:#77609b;margin-top:10px}.cover-bubble{font-size:38px;position:absolute;bottom:18px;right:38px;animation:float 3.5s ease-in-out infinite}
.cover-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(95deg,#fffaf0,#fff7fb,#f2fbff);padding:13px 19px;color:#795ba1;font-size:14px}.cover-bottom strong{color:#663da1;font-size:16px}.cover-bottom .btn{font-size:13px;padding:9px 13px}
.cover-upload-tip{color:#7154a6;font-size:12px;font-style:italic}
@media(max-width:800px){.sidebar:before{width:250px}.cover-title-strip{align-items:flex-start;flex-direction:column;padding:18px 19px}.cover-photo-scene.with-image{padding:8px}.cover-photo-scene img{max-height:390px}.cover-default{min-height:220px;padding:30px 12px;gap:12px}.cover-default-copy strong{font-size:23px}.cover-default-copy span{font-size:14px}.cover-main-emoji{font-size:70px}.cover-bottom{padding:13px}.cover-controls button{font-size:13px}}
@media(max-width:480px){.cover-default{min-height:180px}.cover-main-emoji{font-size:53px}.cover-default-copy strong{font-size:21px}.cover-default-copy span{font-size:13px}.cover-default:before{font-size:24px}.cover-bubble{font-size:20px}.cover-title-strip h2{font-size:23px}.cover-controls button{padding:8px 11px}}
@media print{.cover-controls,.cover-bottom .btn{display:none!important}.cover-board{box-shadow:none;break-inside:avoid}}

<body><div id="app"></div><div id="toastZone" class="toast-zone" aria-live="polite"></div><input type="file" id="coverUploadInput" accept="image/png,image/jpeg,image/webp" hidden aria-label="Chọn ảnh bìa lớp học">
<script>
'use strict';
const STORAGE='lop_hoc_so_thong_minh_v1';
const LEVELS={HTT:'Hoàn thành tốt',HT:'Hoàn thành',CHT:'Chưa hoàn thành'};
const SUBJECTS=['Toán','Tiếng Việt','Tiếng Anh','Khoa học','Lịch sử và Địa lí','Công nghệ','Tin học','Đạo đức','Mĩ thuật','Âm nhạc','Giáo dục thể chất','Hoạt động trải nghiệm'];
const DAYS=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu'];
const menu=[['dashboard','🏡','Tổng quan'],['classes','🏫','Quản lí lớp'],['students','👧','Học sinh'],['attendance','✅','Chuyên cần'],['learning','📈','Báo cáo môn học'],['picker','🎡','Gọi tên ngẫu nhiên'],['rewards','🏆','Thi đua – khen thưởng'],['schedule','📆','Thời khóa biểu'],['tasks','📚','Nhiệm vụ học tập'],['assistant','✨','Trợ lí giáo viên']];
const defaults=()=>({version:1,classes:[],students:[],attendance:[],learning:[],rewards:[],tasks:[],schedules:{},called:{},selectedClassId:null,coverImage:null});
let data;try{data=JSON.parse(localStorage.getItem(STORAGE))||defaults();if(!Array.isArray(data.classes)||!Array.isArray(data.students))throw Error('Invalid data');data={...defaults(),...data}}catch{data=defaults()}
let ui={page:'dashboard',modal:null,editingId:null,studentSearch:'',attendanceDate:today(),learningSubject:'Tất cả môn',pickerGroup:'Tất cả tổ',pickerUnique:true,pickerBusy:false,rewardDate:today(),helpMode:'summary',assistantStudent:'',assistantText:'',menuOpen:false};
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function id(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}_${Math.random().toString(36).slice(2)}`}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){toast('Không lưu được dữ liệu trên trình duyệt. Hãy sao lưu JSON.',true)}}
function toast(msg,isErr=false){const el=document.createElement('div');el.className='toast'+(isErr?' error':'');el.textContent=msg;document.getElementById('toastZone').append(el);setTimeout(()=>el.remove(),3100)}
function current(){return data.classes.find(c=>c.id===data.selectedClassId)||null}
function students(){return data.students.filter(s=>s.classId===data.selectedClassId).sort((a,b)=>a.name.localeCompare(b.name,'vi'))}
function classStudents(cid){return data.students.filter(s=>s.classId===cid)}
function peopleCount(){return students().length}
function dateVi(x){if(!x)return '—';const a=x.split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:x}
function todayAttendance(){return data.attendance.filter(a=>a.classId===data.selectedClassId&&a.date===ui.attendanceDate)}
function schoolYear(){let d=new Date();return d.getMonth()>=7?`${d.getFullYear()}–${d.getFullYear()+1}`:`${d.getFullYear()-1}–${d.getFullYear()}`}
function subjectOptions(active=''){return (current()?.subjects||SUBJECTS).map(s=>`<option ${s===active?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}
function studentsOptions(active=''){return students().map(s=>`<option ${s.id===active?'selected':''} value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}
function latestLearning(subj){let arr=data.learning.filter(r=>r.classId===data.selectedClassId&&(subj==='Tất cả môn'||r.subject===subj));const mp=new Map();arr.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||'').localeCompare(b.created||''));for(const r of arr)mp.set(subj==='Tất cả môn'?r.studentId+'|'+r.subject:r.studentId,r);return Array.from(mp.values())}
function learningStats(subj){let arr=latestLearning(subj);return {total:arr.length,good:arr.filter(x=>x.level==='HTT').length,ok:arr.filter(x=>x.level==='HT').length,need:arr.filter(x=>x.level==='CHT').length,scored:arr.filter(x=>x.score!==''&&x.score!==null&&x.score!==undefined)}}
function attStatus(s,date=ui.attendanceDate){return data.attendance.find(a=>a.classId===data.selectedClassId&&a.studentId===s&&a.date===date)?.status||''}
function attendanceCounts(date=ui.attendanceDate){const rec=data.attendance.filter(a=>a.classId===data.selectedClassId&&a.date===date);return {P:rec.filter(a=>a.status==='P').length,E:rec.filter(a=>a.status==='E').length,A:rec.filter(a=>a.status==='A').length,unmarked:peopleCount()-rec.length}}
function pointsFor(sid){return data.rewards.filter(r=>r.classId===data.selectedClassId&&r.studentId===sid).reduce((a,r)=>a+Number(r.points||0),0)}
function clickable(page,icon,label){return `<button class="nav-btn ${ui.page===page?'active':''}" data-page="${page}"><span class="nav-ico">${icon}</span>${label}</button>`}
function topTitle(){return ({dashboard:'Tổng quan lớp học',classes:'Quản lí lớp học',students:'Hồ sơ học sinh',attendance:'Chuyên cần – nền nếp',learning:'Báo cáo học tập',picker:'Gọi tên ngẫu nhiên',rewards:'Thi đua – khen thưởng',schedule:'Thời khóa biểu',tasks:'Nhiệm vụ học tập',assistant:'Trợ lí giáo viên'})[ui.page]}
function pageHeading(title,subtitle,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-actions">${actions}</div></div>`}
function empty(emoji,title,body,btn=''){return `<div class="empty"><div class="empty-emoji">${emoji}</div><h2>${title}</h2><p>${body}</p>${btn}</div>`}
function noClass(){return empty('🏫','Chào mừng đến với lớp học số!','Hãy tạo lớp đầu tiên để bắt đầu quản lí học sinh, chuyên cần, kết quả học tập và nhiều tiện ích khác.','<button class="btn" data-modal="class">＋ Tạo lớp đầu tiên</button>')}
function render(){if(!current()&&ui.page!=='classes'&&data.classes.length) data.selectedClassId=data.classes[0].id;
 let content;switch(ui.page){case 'dashboard':content=renderDashboard();break;case 'classes':content=renderClasses();break;case 'students':content=renderStudents();break;case 'attendance':content=renderAttendance();break;case 'learning':content=renderLearning();break;case 'picker':content=renderPicker();break;case 'rewards':content=renderRewards();break;case 'schedule':content=renderSchedule();break;case 'tasks':content=renderTasks();break;case 'assistant':content=renderAssistant();break;default:content=renderDashboard()}
 document.getElementById('app').innerHTML=`<div class="app ${ui.menuOpen?'menu-open':''}"><aside class="sidebar"><div class="brand"><div class="brand-icon">📚</div><div><div class="brand-name">LỚP HỌC SỐ<br>THÔNG MINH</div><div class="brand-sub">SMART CLASSROOM</div></div></div><div class="nav-label">KHÔNG GIAN LÀM VIỆC</div><nav>${menu.map(m=>clickable(...m)).join('')}</nav><div class="side-end"><button class="btn secondary" style="width:100%;margin-bottom:11px" data-modal="backup">☁️ Sao lưu / Phục hồi</button><button class="btn ghost" style="width:100%;margin-bottom:10px" data-modal="help">ⓘ Hướng dẫn sử dụng</button><div class="privacy-chip"><span>🔐</span><span>Dữ liệu lưu trong trình duyệt của thiết bị. Hãy sao lưu định kì.</span></div></div></aside><div class="main-wrap"><header class="topbar"><div class="top-left"><button class="menu-toggle" data-action="menu">☰</button><div><h2>${topTitle()}</h2><div class="clock-date">${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div></div><div class="top-right"><select class="select-class" id="classSelect" aria-label="Chọn lớp"><option value="">${data.classes.length?'Chọn lớp học':'Chưa có lớp'}</option>${data.classes.map(c=>`<option value="${esc(c.id)}" ${c.id===data.selectedClassId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="tool-button" data-modal="class" title="Thêm lớp">＋</button><div class="avatar">👩‍🏫</div></div></header><main class="content">${content}<div class="footer-note">🌷 LỚP HỌC SỐ THÔNG MINH · Học liệu số dành cho giáo viên · Bản ứng dụng ngoại tuyến</div></main></div></div>${renderModal()}`;
}
function coverBanner(curr=null){
 const picture=typeof data.coverImage==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(data.coverImage)?data.coverImage:null;
 return `<section class="cover-board" aria-label="Ảnh bìa Lớp học số thông minh">
 <div class="cover-title-strip"><div><h2>🌈 LỚP HỌC SỐ THÔNG MINH</h2><p>Không gian học tập sáng tạo – Quản lí hiệu quả – Mỗi ngày một niềm vui ✨</p></div><div class="cover-controls"><button type="button" data-action="uploadCover">🖼️ ${picture?'Đổi ảnh bìa':'Chọn ảnh bìa'}</button>${picture?'<button type="button" class="remove" data-action="removeCover">↺ Gỡ ảnh</button>':''}</div></div>
 <div id="coverDropZone" title="Kéo thả ảnh vào đây hoặc nhấn Ctrl+V để dùng làm ảnh bìa" class="cover-photo-scene ${picture?'with-image':''}">${picture?`<img src="${picture}" alt="Ảnh bìa do giáo viên lựa chọn, hiển thị trọn ảnh không cắt xén">`:`<div class="cover-default"><div class="cover-main-emoji">🏫</div><div class="cover-default-copy"><strong>Lớp học hạnh phúc<br>Kiến tạo tương lai</strong><span>📚 Học tập · 🌟 Trải nghiệm · 🎉 Sáng tạo</span><span class="cover-upload-tip">Chọn, kéo thả hoặc dán ảnh (Ctrl+V) để làm ảnh bìa.</span></div><span class="cover-bubble">🎈 ✏️ ⭐</span></div>`}</div>
 <div class="cover-bottom"><span><strong>${curr?`Lớp ${esc(curr.name)}`:'Chào mừng đến với ứng dụng'} </strong> · ${curr?'Cùng học sinh tiến bộ mỗi ngày':'Tạo lớp đầu tiên để bắt đầu'}</span><div class="row-actions">${curr?'<button class="btn mint" data-page="picker">🎡 Gọi tên</button><button class="btn pink" data-page="learning">📊 Báo cáo môn</button>':'<button class="btn" data-modal="class">＋ Thêm lớp mới</button>'}</div></div>
 </section>`;
}
function renderDashboard(){if(!current())return `${coverBanner()}${noClass()}`;const counts=attendanceCounts(today());const allLearning=learningStats('Tất cả môn');const rewards=data.rewards.filter(r=>r.classId===data.selectedClassId);const tasks=data.tasks.filter(t=>t.classId===data.selectedClassId&&!t.done);const curr=current();const subjects=curr.subjects||SUBJECTS;const chart=subjects.map(sub=>({sub,...learningStats(sub)})).filter(x=>x.total>0).slice(0,6);
 return `${coverBanner(curr)}
 <div class="grid g4" style="margin-bottom:22px"><div class="card stat"><div class="stat-icon">👩‍🎓</div><div class="stat-number">${peopleCount()}</div><div class="stat-label">Học sinh</div><div class="stat-meta">${esc(curr.name)} · ${esc(curr.year||'')}</div></div><div class="card stat"><div class="stat-icon">✅</div><div class="stat-number">${counts.P}<small style="font-size:14px">/${peopleCount()}</small></div><div class="stat-label">Có mặt hôm nay</div><div class="stat-meta">${counts.unmarked} em chưa điểm danh</div></div><div class="card stat"><div class="stat-icon">📊</div><div class="stat-number">${allLearning.total}</div><div class="stat-label">Kết quả môn học mới nhất</div><div class="stat-meta">${allLearning.good} lượt mức hoàn thành tốt</div></div><div class="card stat"><div class="stat-icon">🏆</div><div class="stat-number">${rewards.reduce((a,r)=>a+Number(r.points||0),0)}</div><div class="stat-label">Sao khen thưởng</div><div class="stat-meta">${tasks.length} nhiệm vụ cần hoàn thành</div></div></div>
 <div class="grid g2" style="margin-bottom:20px"><div class="card"><div class="section-head"><h2>📌 Thao tác nhanh</h2><small>Học tập và quản lí</small></div><div class="quick-cards"><button class="quick" data-modal="student"><span class="quick-ico">👧</span>Thêm học sinh</button><button class="quick" data-page="attendance"><span class="quick-ico">✅</span>Điểm danh</button><button class="quick" data-modal="learning"><span class="quick-ico">📈</span>Ghi kết quả</button><button class="quick" data-page="picker"><span class="quick-ico">🎡</span>Gọi tên</button></div></div><div class="card"><div class="section-head"><h2>📊 Tình hình học tập theo môn</h2><button class="btn sm secondary" data-page="learning">Xem chi tiết →</button></div>${chart.length?chart.map(x=>`<div class="bar-line"><div class="bar-name" title="${esc(x.sub)}">${esc(x.sub)}</div><div class="bar-wrap"><div class="bar" style="width:${Math.round(x.good/x.total*100)}%"></div></div><div class="bar-num">${Math.round(x.good/x.total*100)}%</div></div>`).join('')+'<small>Thanh biểu thị tỉ lệ mức Hoàn thành tốt trong các kết quả mới nhất đã ghi.</small>':'<div style="padding:23px 4px;color:#a3adbc;font-size:12px">Chưa có kết quả học tập. Hãy ghi nhận kết quả theo từng môn để xem biểu đồ.</div>'}</div></div>
 <div class="grid g2"><div class="card"><div class="section-head"><h2>🌟 Gương mặt tích cực</h2><button class="btn sm secondary" data-page="rewards">Xem thi đua →</button></div>${renderTop(4)}</div><div class="card"><div class="section-head"><h2>📚 Công việc sắp tới</h2><button class="btn sm secondary" data-page="tasks">Xem tất cả →</button></div>${tasks.length?tasks.slice().sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999')).slice(0,4).map(t=>`<div class="list-note"><span>📍</span><div><strong style="font-size:12px">${esc(t.title)}</strong><br><span>Hạn: ${dateVi(t.deadline)} · ${esc(t.description||'')}</span></div></div>`).join(''):'<div class="muted" style="padding:25px 0;font-size:12px">Chưa có nhiệm vụ đang thực hiện.</div>'}</div></div>`}
function renderClasses(){return `${pageHeading('Quản lí lớp học','Tạo và chuyển đổi không giới hạn lớp học, dữ liệu mỗi lớp độc lập.','<button class="btn" data-modal="class">＋ Thêm lớp mới</button>')}${data.classes.length?`<div class="grid g3">${data.classes.map(c=>`<div class="class-card"><div class="class-decor">🏫</div><h3>Lớp ${esc(c.name)} ${c.id===data.selectedClassId?'<span class="tag mint">Đang chọn</span>':''}</h3><p>${esc(c.school||'Chưa ghi tên trường')}<br>Năm học: ${esc(c.year||'—')}<br>Giáo viên: ${esc(c.teacher||'—')}</p><div class="class-count">👩‍🎓 ${classStudents(c.id).length} học sinh · ${(c.subjects||SUBJECTS).length} môn</div><div class="row-actions"><button class="btn sm ${c.id===data.selectedClassId?'secondary':'mint'}" data-action="selectClass" data-id="${esc(c.id)}">${c.id===data.selectedClassId?'Đang mở':'Mở lớp'}</button><button class="btn sm secondary" data-modal="class" data-id="${esc(c.id)}">Sửa</button><button class="btn sm danger" data-action="deleteClass" data-id="${esc(c.id)}">Xóa</button></div></div>`).join('')}</div>`:noClass()}<div class="tip" style="margin-top:17px">💡 Mỗi lớp lưu riêng học sinh, đánh giá môn học, chuyên cần, thi đua và thời khóa biểu. Xóa lớp sẽ xóa toàn bộ dữ liệu liên quan, nên hãy sao lưu trước.</div>`}
function renderStudents(){if(!current())return noClass();let filtered=students().filter(s=>!ui.studentSearch||[s.name,s.group,s.note].join(' ').toLowerCase().includes(ui.studentSearch.toLowerCase()));let groups=[...new Set(students().map(s=>s.group).filter(Boolean))];return `${pageHeading('Hồ sơ học sinh',`Danh sách lớp ${esc(current().name)} · ${peopleCount()} học sinh`,'<button class="btn secondary" data-action="downloadStudents">↓ Xuất CSV</button><button class="btn secondary" data-modal="bulk">≡ Thêm hàng loạt</button><button class="btn" data-modal="student">＋ Thêm học sinh</button>')}<div class="grid g4" style="margin-bottom:20px"><div class="card stat"><div class="stat-icon">👩‍🎓</div><div class="stat-number">${peopleCount()}</div><div class="stat-label">Tổng số học sinh</div></div><div class="card stat"><div class="stat-icon">🗂️</div><div class="stat-number">${groups.length}</div><div class="stat-label">Tổ học tập</div></div><div class="card stat"><div class="stat-icon">📒</div><div class="stat-number">${data.learning.filter(x=>x.classId===data.selectedClassId).length}</div><div class="stat-label">Lượt đánh giá môn</div></div><div class="card stat"><div class="stat-icon">🌟</div><div class="stat-number">${data.rewards.filter(x=>x.classId===data.selectedClassId).length}</div><div class="stat-label">Lượt khen thưởng</div></div></div><div class="card"><div class="toolbar"><input type="search" id="studentSearch" placeholder="🔎 Tìm học sinh, tổ, ghi chú..." value="${esc(ui.studentSearch)}"/><span class="muted" style="margin-left:auto">Hiển thị ${filtered.length}/${peopleCount()} học sinh</span></div>${peopleCount()?`<div class="table-scroll"><table class="data-table"><thead><tr><th>STT</th><th>Họ tên học sinh</th><th>Tổ</th><th>Chức vụ</th><th>Sao thưởng</th><th>Thao tác</th></tr></thead><tbody>${filtered.map((s,i)=>`<tr><td>${i+1}</td><td><span class="student-avatar ${i%3===0?'alt':''}">${esc(s.name.charAt(0).toUpperCase())}</span><span class="student-name">${esc(s.name)}</span></td><td>${esc(s.group||'—')}</td><td>${esc(s.role||'—')}</td><td>⭐ ${pointsFor(s.id)}</td><td><button class="btn sm secondary" data-modal="student" data-id="${esc(s.id)}">Sửa</button> <button class="btn sm danger" data-action="deleteStudent" data-id="${esc(s.id)}">Xóa</button></td></tr>`).join('')}</tbody></table></div>`:empty('🧒','Lớp chưa có học sinh','Cô có thể thêm từng em hoặc dán cả danh sách để nhập nhanh.','<button class="btn" data-modal="bulk">＋ Nhập danh sách học sinh</button>')}</div>`}
function renderAttendance(){if(!current())return noClass();const list=students();const n=attendanceCounts();return `${pageHeading('Chuyên cần – nền nếp',`Điểm danh từng ngày cho lớp ${esc(current().name)}`,'<button class="btn secondary" data-action="downloadAttendance">↓ Xuất CSV</button><button class="btn mint" data-action="markAllPresent">✓ Đánh dấu tất cả có mặt</button>')}<div class="card" style="margin-bottom:18px"><div class="section-head"><h2>📆 Ngày điểm danh</h2><div class="pill-date"><input class="date-input" type="date" id="attendanceDate" value="${esc(ui.attendanceDate)}"/></div></div><div class="grid g4"><div class="report-pill"><strong>${list.length}</strong><small>Danh sách lớp</small></div><div class="report-pill"><strong class="good">${n.P}</strong><small>Đi học</small></div><div class="report-pill"><strong>${n.E+n.A}</strong><small>Nghỉ học</small></div><div class="report-pill"><strong>${n.unmarked}</strong><small>Chưa đánh dấu</small></div></div></div><div class="card">${list.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>STT</th><th>Học sinh</th><th>Tổ</th><th>Đánh dấu trạng thái</th></tr></thead><tbody>${list.map((s,i)=>{let st=attStatus(s.id);return `<tr><td>${i+1}</td><td><strong>${esc(s.name)}</strong></td><td>${esc(s.group||'—')}</td><td><div class="status-controls"><button title="Có mặt" class="status-button present ${st==='P'?'active':''}" data-att="P" data-id="${esc(s.id)}">✓ Có mặt</button><button title="Nghỉ có phép" class="status-button excused ${st==='E'?'active':''}" data-att="E" data-id="${esc(s.id)}">Có phép</button><button title="Nghỉ không phép" class="status-button absent ${st==='A'?'active':''}" data-att="A" data-id="${esc(s.id)}">Không phép</button></div></td></tr>`}).join('')}</tbody></table></div>`:empty('🧾','Chưa có danh sách điểm danh','Thêm học sinh để bắt đầu ghi nhận chuyên cần.','<button class="btn" data-page="students">Đến danh sách học sinh</button>')}</div><div class="tip" style="margin-top:13px">🔐 Chỉ số chuyên cần dựa trên dữ liệu đã đánh dấu. "Chưa đánh dấu" không được tính là đi học hay nghỉ học.</div>`}
function renderLearning(){if(!current())return noClass();const subj=ui.learningSubject;const subjects=current().subjects||SUBJECTS;const st=learningStats(subj);const studentsList=students();let recent=data.learning.filter(r=>r.classId===data.selectedClassId&&(subj==='Tất cả môn'||r.subject===subj)).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||'').localeCompare(a.created||''));const latest=new Map(latestLearning(subj).map(r=>[r.studentId,r]));return `${pageHeading('Báo cáo học tập theo môn',`Theo dõi sự tiến bộ của học sinh lớp ${esc(current().name)}`,'<button class="btn secondary" data-modal="subjects">⚙ Quản lí môn</button><button class="btn secondary" data-action="downloadLearning">↓ Xuất CSV</button><button class="btn" data-modal="learning">＋ Ghi kết quả</button>')}<div class="card" style="margin-bottom:17px"><div class="toolbar"><label for="learningSubject" style="margin:0">Môn học</label><select id="learningSubject"><option ${subj==='Tất cả môn'?'selected':''}>Tất cả môn</option>${subjects.map(s=>`<option value="${esc(s)}" ${s===subj?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="btn sm secondary" data-action="print">🖨 In báo cáo</button><small style="margin-left:auto">Báo cáo tổng hợp tính theo kết quả gần nhất của từng học sinh ở mỗi môn</small></div><div class="report-stats"><div class="report-pill"><strong>${st.total}</strong><small>Kết quả mới nhất đã ghi</small></div><div class="report-pill"><strong class="good">${st.good}</strong><small>Hoàn thành tốt</small></div><div class="report-pill"><strong>${st.ok}</strong><small>Hoàn thành</small></div><div class="report-pill"><strong class="bad">${st.need}</strong><small>Chưa hoàn thành</small></div>${st.scored.length?`<div class="report-pill"><strong>${(st.scored.reduce((a,r)=>a+Number(r.score),0)/st.scored.length).toFixed(1)}</strong><small>Điểm trung bình ghi nhận</small></div>`:''}</div></div>
 ${subj==='Tất cả môn'?`<div class="card" style="margin-bottom:18px"><div class="section-head"><h2>📚 Tổng quan từng môn</h2><small>Thống kê theo dữ liệu đã nhập</small></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Môn học</th><th>Đã có kết quả</th><th>Hoàn thành tốt</th><th>Hoàn thành</th><th>Chưa hoàn thành</th><th></th></tr></thead><tbody>${subjects.map(s=>{const a=learningStats(s);return `<tr><td><strong>${esc(s)}</strong></td><td>${a.total} / ${studentsList.length}</td><td><span class="tag mint">${a.good}</span></td><td><span class="tag blue">${a.ok}</span></td><td><span class="tag pink">${a.need}</span></td><td><button class="btn sm secondary" data-action="subjectOnly" data-subject="${esc(s)}">Chi tiết →</button></td></tr>`}).join('')}</tbody></table></div></div>`:`<div class="card" style="margin-bottom:18px"><div class="section-head"><h2>👩‍🎓 Kết quả mới nhất: ${esc(subj)}</h2><small>${studentsList.length} học sinh trong lớp</small></div>${studentsList.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Học sinh</th><th>Tổ</th><th>Mức độ</th><th>Điểm</th><th>Ngày</th><th>Nhận xét</th><th></th></tr></thead><tbody>${studentsList.map(s=>{let r=latest.get(s.id);return `<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.group||'—')}</td><td>${r?levelTag(r.level):'<span class="muted">Chưa ghi</span>'}</td><td>${r&&r.score!==''?esc(r.score):'—'}</td><td>${r?dateVi(r.date):'—'}</td><td>${r?esc(r.note||'—'):'—'}</td><td><button class="btn sm secondary" data-modal="learning" data-student="${esc(s.id)}">＋ Ghi</button></td></tr>`}).join('')}</tbody></table></div>`:empty('📚','Chưa có học sinh','Thêm danh sách học sinh trước khi ghi kết quả.')}</div>`}
 <div class="card"><div class="section-head"><h2>📝 Nhật kí đánh giá gần đây</h2><small>${recent.length} bản ghi</small></div>${recent.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Môn học</th><th>Mức độ</th><th>Điểm</th><th>Thao tác</th></tr></thead><tbody>${recent.slice(0,30).map(r=>`<tr><td>${dateVi(r.date)}</td><td>${esc(data.students.find(s=>s.id===r.studentId)?.name||'(đã xóa)')}</td><td>${esc(r.subject)}</td><td>${levelTag(r.level)}</td><td>${r.score!==''?esc(r.score):'—'}</td><td><button class="btn sm secondary" data-modal="learning" data-id="${esc(r.id)}">Sửa</button> <button class="btn sm danger" data-action="deleteLearning" data-id="${esc(r.id)}">Xóa</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted" style="padding:18px">Chưa có kết quả học tập.</div>'}</div><div class="tip" style="margin-top:14px">📌 Hệ thống hỗ trợ ghi nhận quá trình học tập. Kết quả cần được giáo viên kiểm tra theo quy định đánh giá hiện hành; không tự thay thế hồ sơ đánh giá chính thức.</div>`}
function levelTag(v){return `<span class="tag ${v==='HTT'?'mint':v==='HT'?'blue':'pink'}">${esc(LEVELS[v]||'—')}</span>`}
function eligibleStudents(){let ss=students();if(ui.pickerGroup!=='Tất cả tổ')ss=ss.filter(s=>s.group===ui.pickerGroup);if(ui.pickerUnique){let called=data.called[data.selectedClassId]||[];ss=ss.filter(s=>!called.includes(s.id))}return ss}
function renderPicker(){if(!current())return noClass();let ss=students();let groups=[...new Set(ss.map(s=>s.group).filter(Boolean))].sort();let called=(data.called[data.selectedClassId]||[]).map(i=>data.students.find(s=>s.id===i)).filter(Boolean);return `${pageHeading('Gọi tên học sinh ngẫu nhiên','Tạo sự công bằng, niềm vui và tương tác trong giờ học.','<button class="btn secondary" data-action="resetPicker">↺ Làm mới lượt gọi</button>')}<div class="grid g2"><div class="card"><div class="section-head"><h2>🎡 Chiếc hộp may mắn</h2><span class="tag purple">${eligibleStudents().length} học sinh có thể được gọi</span></div><div class="toolbar"><select id="pickerGroup"><option ${ui.pickerGroup==='Tất cả tổ'?'selected':''}>Tất cả tổ</option>${groups.map(g=>`<option ${ui.pickerGroup===g?'selected':''}>${esc(g)}</option>`).join('')}</select><label style="display:flex;align-items:center;gap:7px;white-space:nowrap;margin:0"><input type="checkbox" id="pickerUnique" ${ui.pickerUnique?'checked':''} style="width:17px;height:17px;accent-color:#957cda">Không gọi trùng</label></div><div class="picker-stage" id="pickerStage"><div class="icon-big">🌈</div><div class="picker-display" id="pickerDisplay">Sẵn sàng chưa nào?</div><div class="muted tiny" id="pickerPrompt">Nhấn nút để chọn bạn may mắn</div></div><div class="picker-footer"><button class="btn" id="pickButton" data-action="pick" ${!eligibleStudents().length?'disabled':''}>✨ GỌI TÊN NGẪU NHIÊN</button></div><div class="tip" style="margin-top:20px">🌼 Mỗi học sinh trong phạm vi chọn có xác suất như nhau. Bật “Không gọi trùng” để lần lượt mời nhiều bạn khác nhau.</div></div><div class="card"><div class="section-head"><h2>📜 Những bạn đã được gọi</h2><span class="tag mint">${called.length} lượt không trùng</span></div>${called.length?`<div class="picked-list">${called.map((s,i)=>`<span class="picked-chip">${i+1}. ${esc(s.name)}</span>`).join('')}</div>`:empty('🎉','Bắt đầu lượt gọi mới!','Tên học sinh được chọn sẽ xuất hiện tại đây.')}<div class="dividing"></div><h3>💡 Gợi ý sử dụng</h3><div class="help-split"><div class="info-card"><strong>🎤 Trả lời câu hỏi</strong><p>Chọn một bạn bất ngờ để tham gia xây dựng bài.</p></div><div class="info-card"><strong>📖 Đọc bài</strong><p>Luân phiên mời học sinh đọc hoặc trình bày.</p></div><div class="info-card"><strong>🗣️ Chia sẻ</strong><p>Khuyến khích các em phát biểu và hợp tác.</p></div></div></div></div>`}
function renderTop(limit=20){let s=students().map(x=>({...x,points:pointsFor(x.id)})).filter(x=>x.points>0).sort((a,b)=>b.points-a.points).slice(0,limit);const max=s[0]?.points||1;return s.length?s.map((x,i)=>`<div class="leader-row"><div class="leader-rank">${i+1}</div><span class="student-avatar ${i%2?'alt':''}">${esc(x.name[0])}</span><div style="flex:1;min-width:0"><strong style="font-size:12px">${esc(x.name)}</strong><div class="bar-wrap" style="margin-top:6px"><div class="bar" style="width:${Math.round(x.points/max*100)}%"></div></div></div><span class="rank-score">⭐ ${x.points}</span></div>`).join(''):'<div class="muted" style="padding:22px 0">Chưa có ghi nhận khen thưởng.</div>'}
function renderRewards(){if(!current())return noClass();let arr=data.rewards.filter(r=>r.classId===data.selectedClassId).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);return `${pageHeading('Thi đua – khen thưởng','Khuyến khích những việc làm tốt và ghi nhận sự tiến bộ của mỗi em.','<button class="btn" data-modal="reward">🌟 Tặng sao / huy hiệu</button>')}<div class="grid g2"><div class="card"><div class="section-head"><h2>🏆 Góc tỏa sáng</h2><small>Điểm tích lũy khích lệ</small></div>${renderTop()}</div><div class="card"><div class="section-head"><h2>🌼 Nhật kí khen thưởng</h2></div>${arr.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Lý do</th><th>Sao</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${dateVi(x.date)}</td><td>${esc(data.students.find(s=>s.id===x.studentId)?.name||'—')}</td><td>${esc(x.reason)}</td><td>+${Number(x.points)}</td><td><button class="btn sm danger" data-action="deleteReward" data-id="${esc(x.id)}">Xóa</button></td></tr>`).join('')}</tbody></table></div>`:empty('🌟','Lan tỏa lời khen','Bắt đầu ghi nhận một hành động tốt đầu tiên.','<button class="btn" data-modal="reward">＋ Ghi nhận thành tích</button>')}<div class="tip" style="margin-top:15px">💗 Ưu tiên khen sự cố gắng, tiến bộ và hợp tác. Không dùng tổng sao để gắn nhãn năng lực hay phẩm chất học sinh.</div></div></div>`}
function renderSchedule(){if(!current())return noClass();const sc=data.schedules[data.selectedClassId]||{};const arr=current().subjects||SUBJECTS;return `${pageHeading('Thời khóa biểu','Chỉnh sửa thời khóa biểu riêng cho từng lớp.','<button class="btn secondary" data-action="print">🖨 In thời khóa biểu</button>')}<div class="card"><div class="section-head"><h2>🗓️ Thời khóa biểu lớp ${esc(current().name)}</h2><small>7 tiết/ngày · chọn môn để cập nhật tự động</small></div><div class="timetable"><table class="timegrid"><thead><tr><th>Tiết</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${Array.from({length:7},(_,i)=>`<tr><td>${i<4?`Sáng ${i+1}`:`Chiều ${i-3}`}</td>${DAYS.map((d,di)=>{let k=`${di}-${i}`,val=sc[k]||'';return `<td><select data-schedule="${k}"><option value="">— Chọn môn —</option>${[...arr,'Sinh hoạt lớp','Tự học','Nghỉ'].filter((x,i,a)=>a.indexOf(x)===i).map(s=>`<option value="${esc(s)}" ${s===val?'selected':''}>${esc(s)}</option>`).join('')}</select></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div><div class="tip" style="margin-top:14px">🎨 Cô có thể thay đổi danh sách môn học trong phần “Báo cáo học tập → Quản lí môn”.</div>`}
function renderTasks(){if(!current())return noClass();let arr=data.tasks.filter(x=>x.classId===data.selectedClassId).slice().sort((a,b)=>Number(a.done)-Number(b.done)||(a.deadline||'9999').localeCompare(b.deadline||'9999'));return `${pageHeading('Nhiệm vụ học tập','Lập kế hoạch và theo dõi những việc cần làm của lớp.','<button class="btn" data-modal="task">＋ Tạo nhiệm vụ</button>')}<div class="grid g4" style="margin-bottom:18px"><div class="card stat"><div class="stat-icon">📎</div><div class="stat-number">${arr.length}</div><div class="stat-label">Tổng nhiệm vụ</div></div><div class="card stat"><div class="stat-icon">⏳</div><div class="stat-number">${arr.filter(x=>!x.done).length}</div><div class="stat-label">Đang thực hiện</div></div><div class="card stat"><div class="stat-icon">🌱</div><div class="stat-number">${arr.filter(x=>x.done).length}</div><div class="stat-label">Đã hoàn thành</div></div><div class="card stat"><div class="stat-icon">📌</div><div class="stat-number">${arr.filter(x=>!x.done&&x.deadline&&x.deadline<today()).length}</div><div class="stat-label">Quá hạn</div></div></div><div class="card"><div class="section-head"><h2>📚 Danh sách nhiệm vụ</h2><small>Tích ô khi cả lớp đã hoàn thành</small></div>${arr.length?arr.map(t=>`<div class="task-row ${t.done?'done':''}"><input class="task-checkbox" type="checkbox" data-task-check="${esc(t.id)}" ${t.done?'checked':''} aria-label="Đánh dấu hoàn thành"><div style="flex:1"><div class="task-title">${esc(t.title)}</div><div class="task-details">${dateVi(t.deadline)} · ${esc(t.description||'Không có ghi chú')}</div></div>${t.done?'<span class="tag mint">Hoàn thành</span>':t.deadline&&t.deadline<today()?'<span class="tag pink">Quá hạn</span>':'<span class="tag blue">Đang làm</span>'}<button class="btn sm secondary" data-modal="task" data-id="${esc(t.id)}">Sửa</button><button class="btn sm danger" data-action="deleteTask" data-id="${esc(t.id)}">Xóa</button></div>`).join(''):empty('📖','Chưa có nhiệm vụ','Thêm bài tập, kế hoạch học tập hoặc công việc trong tuần.','<button class="btn" data-modal="task">＋ Tạo nhiệm vụ mới</button>')}</div>`}
function assistantText(){const s=students().find(x=>x.id===ui.assistantStudent);const attendance=attendanceCounts(today());const st=learningStats('Tất cả môn');const toNeeds=latestLearning('Tất cả môn').filter(r=>r.level==='CHT');const taskArr=data.tasks.filter(t=>t.classId===data.selectedClassId&&!t.done);
 if(ui.helpMode==='student'){if(!s)return 'Cô hãy chọn học sinh để nhận một bản gợi ý nhận xét.';let rs=latestLearning('Tất cả môn').filter(r=>r.studentId===s.id);let g=rs.filter(x=>x.level==='HTT').map(x=>x.subject),need=rs.filter(x=>x.level==='CHT').map(x=>x.subject);return `GỢI Ý NHẬN XÉT HỌC SINH: ${s.name}\n\n${s.name} ${g.length?'thể hiện kết quả tích cực trong các môn '+g.join(', ')+'. ': 'đang từng bước rèn luyện và phát triển năng lực học tập. '}${need.length?'Em cần được quan tâm, hỗ trợ thêm ở '+need.join(', ')+'. ':'Giáo viên tiếp tục theo dõi, khích lệ em trong từng hoạt động học tập.'}\n\nGợi ý hỗ trợ: động viên em đặt mục tiêu nhỏ theo tuần, tăng cơ hội phát biểu và trao đổi với gia đình khi cần.\n\n(Lời nhận xét là bản gợi ý; giáo viên cần xem lại để bảo đảm đúng thực tế.)`}
 if(ui.helpMode==='plan')return `GỢI Ý SINH HOẠT LỚP – ${current()?.name||''}\n\n1. KHỞI ĐỘNG (5 phút): Trò chơi “Điều em biết ơn hôm nay”.\n2. CHIA SẺ (10 phút): Các tổ nêu một việc làm tốt và một điều cần cố gắng.\n3. TUYÊN DƯƠNG (8 phút): Ghi nhận các em có tiến bộ qua từng tuần; tặng huy hiệu tích cực.\n4. THẢO LUẬN (8 phút): Mỗi nhóm đề xuất một hành động thiết thực để lớp học hạnh phúc hơn.\n5. CAM KẾT (4 phút): Cả lớp lựa chọn một mục tiêu chung cho tuần tới.\n\nLưu ý: điều chỉnh theo thời lượng tiết học thực tế và đặc điểm lớp.`;
 return `TÓM TẮT LỚP ${current()?.name||''}\n\n• Sĩ số: ${peopleCount()} học sinh.\n• Điểm danh hôm nay: ${attendance.P} có mặt, ${attendance.E+attendance.A} nghỉ, ${attendance.unmarked} chưa cập nhật.\n• Các kết quả học tập mới nhất đã ghi: ${st.total} lượt, gồm ${st.good} hoàn thành tốt, ${st.ok} hoàn thành, ${st.need} chưa hoàn thành.\n• Số lượt kết quả “Chưa hoàn thành” cần theo dõi: ${toNeeds.length}.\n• Nhiệm vụ đang mở: ${taskArr.length}.\n\nĐỀ XUẤT:\n1. Hoàn thành điểm danh đối với các em chưa đánh dấu.\n2. Kiểm tra dữ liệu những môn chưa được cập nhật đầy đủ.\n3. Tổ chức hỗ trợ cá nhân cho những em cần thêm thời gian rèn luyện.\n4. Ghi nhận, động viên các hành vi tích cực trong lớp.\n\nBản tóm tắt được tạo từ dữ liệu hiện có trên thiết bị.`}
function renderAssistant(){if(!current())return noClass();const text=ui.assistantText||assistantText();return `${pageHeading('Trợ lí giáo viên','Hỗ trợ tổng hợp số liệu, gợi ý nhận xét và xây dựng tiết sinh hoạt lớp.','<button class="btn secondary" data-action="copySuggestion">⧉ Sao chép gợi ý</button>')}<div class="grid g2"><div class="card"><div class="section-head"><h2>✨ Cô muốn hỗ trợ nội dung gì?</h2></div><div class="field"><label>Chọn loại gợi ý</label><select id="helpMode"><option value="summary" ${ui.helpMode==='summary'?'selected':''}>Phân tích nhanh tình hình lớp</option><option value="student" ${ui.helpMode==='student'?'selected':''}>Gợi ý nhận xét học sinh</option><option value="plan" ${ui.helpMode==='plan'?'selected':''}>Kế hoạch sinh hoạt lớp 35 phút</option></select></div>${ui.helpMode==='student'?`<div class="field"><label>Học sinh</label><select id="assistantStudent"><option value="">— Chọn học sinh —</option>${studentsOptions(ui.assistantStudent)}</select></div>`:''}<button class="btn" data-action="generateSuggestion">✨ Tạo gợi ý từ dữ liệu hiện có</button><div class="tip warning" style="margin-top:20px">🧠 Chế độ hiện tại là trợ lí gợi ý ngoại tuyến theo quy tắc, không kết nối mô hình AI và không cần khóa API. Giáo viên có thể xem, sửa nội dung trước khi sử dụng.</div></div><div class="card"><div class="section-head"><h2>📄 Nội dung gợi ý</h2><span class="tag purple">Có thể sao chép</span></div><div class="suggestion" id="suggestionBox">${esc(text)}</div></div></div>`}
function renderModal(){if(!ui.modal)return '';let m=ui.modal,obj,head,body,form='',large=false;const modalBtn=(text='Lưu thông tin')=>`<div class="form-actions"><button type="button" class="btn secondary" data-close>Hủy</button><button type="submit" class="btn">💾 ${text}</button></div>`;
 switch(m){
 case 'class':obj=data.classes.find(x=>x.id===ui.editingId)||{};head=obj.id?'Chỉnh sửa lớp học':'Tạo lớp học mới';form='class';body=`<div class="form-grid"><div class="field"><label>Tên lớp *</label><input name="name" required maxlength="35" placeholder="Ví dụ: 2A1, 5A3..." value="${esc(obj.name||'')}"></div><div class="field"><label>Năm học</label><input name="year" maxlength="20" placeholder="2026–2027" value="${esc(obj.year||schoolYear())}"></div></div><div class="field"><label>Trường học (không bắt buộc)</label><input name="school" maxlength="120" placeholder="Nhập tên trường" value="${esc(obj.school||'')}"></div><div class="field"><label>Giáo viên chủ nhiệm (không bắt buộc)</label><input name="teacher" maxlength="80" placeholder="Họ tên giáo viên" value="${esc(obj.teacher||'')}"></div>${modalBtn(obj.id?'Lưu thay đổi':'Tạo lớp')}`;break;
 case 'student':obj=data.students.find(x=>x.id===ui.editingId)||{};head=obj.id?'Chỉnh sửa học sinh':'Thêm học sinh';form='student';body=`<div class="field"><label>Họ và tên học sinh *</label><input name="name" required maxlength="110" placeholder="Nhập họ và tên" value="${esc(obj.name||'')}"></div><div class="form-grid"><div class="field"><label>Tổ</label><input name="group" maxlength="30" placeholder="Ví dụ: Tổ 1" value="${esc(obj.group||'')}"></div><div class="field"><label>Chức vụ</label><input name="role" maxlength="65" placeholder="Ví dụ: Tổ trưởng" value="${esc(obj.role||'')}"></div></div><div class="form-grid"><div class="field"><label>Giới tính (tùy chọn)</label><select name="gender"><option value="">Không ghi</option>${['Nam','Nữ','Khác'].map(g=>`<option ${obj.gender===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Ngày sinh (tùy chọn)</label><input type="date" name="dob" value="${esc(obj.dob||'')}"></div></div><div class="field"><label>Ghi chú riêng</label><textarea name="note" placeholder="Chỉ ghi thông tin thực sự cần thiết">${esc(obj.note||'')}</textarea></div>${modalBtn()}`;break;
 case 'bulk':head='Thêm danh sách học sinh';form='bulk';body=`<div class="tip">👩‍🎓 Mỗi dòng một học sinh. Có thể nhập thêm tổ, chức vụ sau dấu chấm phẩy, dấu tab hoặc dấu phẩy. Ví dụ: Nguyễn Văn An; Tổ 1; Tổ trưởng</div><div class="field" style="margin-top:16px"><label>Dán danh sách học sinh</label><textarea name="bulk" rows="11" placeholder="Nguyễn Văn An; Tổ 1\nTrần Thị Bình; Tổ 2\nLê Minh Châu; Tổ 1"></textarea></div><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="skipDup" checked style="width:18px;height:18px;accent-color:#8b78cc"> Bỏ qua tên trùng đã có trong lớp</label>${modalBtn('Nhập danh sách')}`;break;
 case 'learning':obj=data.learning.find(x=>x.id===ui.editingId)||{};head=obj.id?'Sửa kết quả học tập':'Ghi nhận kết quả học tập';form='learning';let studentId=obj.studentId||ui.modalStudent||'';const ls=ui.learningSubject!=='Tất cả môn'?ui.learningSubject:(current()?.subjects||SUBJECTS)[0];body=`<div class="form-grid"><div class="field"><label>Học sinh *</label><select name="studentId" required><option value="">— Chọn học sinh —</option>${studentsOptions(studentId)}</select></div><div class="field"><label>Môn học *</label><select name="subject" required>${subjectOptions(obj.subject||ls)}</select></div></div><div class="form-grid"><div class="field"><label>Ngày đánh giá *</label><input name="date" type="date" value="${esc(obj.date||today())}" required></div><div class="field"><label>Điểm kiểm tra (nếu có, 0–10)</label><input name="score" type="number" min="0" max="10" step="0.1" placeholder="Không bắt buộc" value="${esc(obj.score??'')}"></div></div><div class="field"><label>Mức độ hoàn thành *</label><select name="level" required>${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${k===(obj.level||'HT')?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Nhận xét quá trình học tập</label><textarea name="note" maxlength="500" placeholder="Ví dụ: Tích cực phát biểu, biết vận dụng kiến thức...">${esc(obj.note||'')}</textarea></div>${modalBtn()}`;break;
 case 'reward':head='Ghi nhận việc làm tốt';form='reward';body=`<div class="form-grid"><div class="field"><label>Học sinh *</label><select name="studentId" required><option value="">— Chọn học sinh —</option>${studentsOptions()}</select></div><div class="field"><label>Ngày</label><input type="date" name="date" value="${today()}" required></div></div><div class="form-grid"><div class="field"><label>Sao thưởng</label><select name="points"><option value="1">⭐ 1 sao</option><option value="2">⭐⭐ 2 sao</option><option value="3">⭐⭐⭐ 3 sao</option><option value="5">🌟 5 sao</option></select></div><div class="field"><label>Hình thức khen</label><select name="reason"><option>Chăm chỉ học tập</option><option>Tích cực phát biểu</option><option>Tiến bộ rõ rệt</option><option>Hợp tác tốt</option><option>Giúp đỡ bạn bè</option><option>Giữ gìn vệ sinh</option><option>Thực hiện nội quy tốt</option><option>Huy hiệu đặc biệt</option></select></div></div><div class="field"><label>Ghi chú (tùy chọn)</label><textarea name="note" placeholder="Ghi hành động tích cực của học sinh"></textarea></div>${modalBtn('Ghi nhận')}`;break;
 case 'task':obj=data.tasks.find(x=>x.id===ui.editingId)||{};head=obj.id?'Chỉnh sửa nhiệm vụ':'Tạo nhiệm vụ mới';form='task';body=`<div class="field"><label>Tên nhiệm vụ *</label><input name="title" maxlength="160" required value="${esc(obj.title||'')}" placeholder="Ví dụ: Đọc bài và chuẩn bị bài tiết sau"></div><div class="field"><label>Hạn hoàn thành</label><input type="date" name="deadline" value="${esc(obj.deadline||today())}"></div><div class="field"><label>Mô tả / hướng dẫn</label><textarea name="description" maxlength="1000" placeholder="Nội dung cần thực hiện">${esc(obj.description||'')}</textarea></div>${modalBtn()}`;break;
 case 'subjects':head='Quản lí danh sách môn học';form='subjects';body=`<div class="tip">📚 Mỗi môn một dòng. Các môn đang được sử dụng trong bảng đánh giá sẽ được giữ lại để tránh mất khả năng xem kết quả cũ.</div><div class="field" style="margin-top:18px"><label>Danh sách môn học của lớp</label><textarea rows="13" name="subjects" required>${esc((current()?.subjects||SUBJECTS).join('\n'))}</textarea></div>${modalBtn('Lưu danh sách môn')}`;break;
 case 'backup':head='Sao lưu và phục hồi dữ liệu';body=`<div class="help-split"><div class="info-card"><strong>📤 Sao lưu về máy</strong><p>Tải toàn bộ các lớp, học sinh và báo cáo thành một tệp JSON.</p><button class="btn mint" style="margin-top:14px" data-action="backup">↓ Tải bản sao lưu</button></div><div class="info-card"><strong>📥 Phục hồi từ tệp</strong><p>Chọn tệp JSON đã sao lưu trước đó. Dữ liệu hiện tại sẽ bị thay thế.</p><label class="btn secondary" style="margin-top:14px;cursor:pointer">↑ Chọn tệp JSON<input id="restoreFile" type="file" accept=".json,application/json" style="display:none"></label></div></div><div class="tip warning" style="margin-top:20px">⚠ Ứng dụng hiện lưu dữ liệu trên chính trình duyệt, không đồng bộ giữa các thiết bị. Không sử dụng thiết bị công cộng để lưu dữ liệu học sinh. Nên tải bản sao lưu thường xuyên và bảo quản an toàn.</div>`;break;
 case 'help':head='Hướng dẫn sử dụng ứng dụng';body=`<div class="help-split"><div class="info-card"><strong>① Tạo lớp học</strong><p>Nhấn “＋” ở góc trên để thêm lớp. Tất cả tên lớp đều do cô tự nhập.</p></div><div class="info-card"><strong>② Thêm học sinh</strong><p>Vào “Học sinh”, thêm từng em hoặc nhập nhiều tên cùng lúc.</p></div><div class="info-card"><strong>③ Theo dõi hằng ngày</strong><p>Chọn ngày, điểm danh; nhập kết quả từng môn và khen thưởng.</p></div><div class="info-card"><strong>④ Gọi tên may mắn</strong><p>Chọn lớp, tổ và chế độ không lặp để gọi ngẫu nhiên trong giờ học.</p></div><div class="info-card"><strong>⑤ Xem và xuất báo cáo</strong><p>Vào “Báo cáo môn học” để lọc từng môn, in hoặc xuất CSV.</p></div><div class="info-card"><strong>⑥ Sao lưu dữ liệu</strong><p>Dùng “Sao lưu / Phục hồi” để tải tệp JSON sang nơi lưu trữ an toàn.</p></div></div><div class="tip warning" style="margin-top:18px">🔒 Đây là bản ứng dụng chạy ngoại tuyến trên từng trình duyệt, chưa có tài khoản, cơ sở dữ liệu trực tuyến hoặc AI thật. Để sử dụng chung cho nhiều giáo viên/thiết bị, cần triển khai phiên bản có máy chủ, xác thực và phân quyền.</div>`;break;
 default:head='Thông tin';body='';
 }
 return `<div class="modal-back" id="modalBack"><div class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-label="${esc(head)}"><div class="modal-header"><h2>${esc(head)}</h2><button class="close-x" data-close aria-label="Đóng">✕</button></div>${form?`<form data-form="${form}">${body}</form>`:body}</div></div>`
}
function modal(name,editingId=null,studentId=null){if(name!=='class'&&!current()){toast('Hãy tạo lớp học trước.',true);return}ui.modal=name;ui.editingId=editingId;ui.modalStudent=studentId;render();setTimeout(()=>document.querySelector('.modal input:not([type=checkbox]),.modal textarea,.modal select')?.focus(),60)}
function closeModal(){ui.modal=null;ui.editingId=null;ui.modalStudent=null;render()}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function download(filename,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),900)}
function downloadCsv(name,header,rows){download(name,'\ufeff'+[header,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function filenamePiece(s){return String(s||'lop').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9_-]/g,'_')}
function exportData(){download('Lop_hoc_so_thong_minh_Sao_luu_'+today()+'.json',JSON.stringify({...data,exportedAt:new Date().toISOString(),app:'Lop hoc so thong minh'},null,2),'application/json;charset=utf-8');toast('Đã xuất tệp sao lưu JSON.')}
function handleSubmit(f){let v=Object.fromEntries(new FormData(f).entries());switch(f.dataset.form){
 case 'class':{let name=(v.name||'').trim(),year=(v.year||'').trim();if(!name){toast('Cần nhập tên lớp.',true);return}if(data.classes.some(c=>c.id!==ui.editingId&&c.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi')&&c.year===year)){toast('Lớp này đã tồn tại trong cùng năm học.',true);return}let prev=data.classes.find(x=>x.id===ui.editingId);let obj={...(prev||{}),id:prev?.id||id(),name,year,school:(v.school||'').trim(),teacher:(v.teacher||'').trim(),subjects:prev?.subjects||[...SUBJECTS]};if(prev)Object.assign(prev,obj);else data.classes.push(obj);data.selectedClassId=obj.id;ui.page='dashboard';toast(prev?'Đã cập nhật lớp học.':'Đã tạo lớp học mới!');break}
 case 'student':{let name=(v.name||'').trim();if(!name){toast('Cần nhập tên học sinh.',true);return}let prev=data.students.find(x=>x.id===ui.editingId);let obj={id:prev?.id||id(),classId:data.selectedClassId,name,group:(v.group||'').trim(),role:(v.role||'').trim(),gender:v.gender||'',dob:v.dob||'',note:(v.note||'').trim()};if(prev)Object.assign(prev,obj);else data.students.push(obj);toast(prev?'Đã sửa hồ sơ.':'Đã thêm học sinh.');break}
 case 'bulk':{let lines=(v.bulk||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0,skipped=0;for(let line of lines){let col=line.split(/[;\t,]/).map(x=>x.trim());let name=col[0]||'';if(!name||/^(họ\s*tên|ho\s*ten|name|stt)$/i.test(name))continue;if(f.querySelector('[name="skipDup"]')?.checked&&data.students.some(s=>s.classId===data.selectedClassId&&s.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'))){skipped++;continue}data.students.push({id:id(),classId:data.selectedClassId,name,group:col[1]||'',role:col[2]||'',gender:'',dob:'',note:''});added++}toast(`Đã nhập ${added} học sinh${skipped?`, bỏ qua ${skipped} tên trùng`:''}.`);ui.page='students';break}
 case 'learning':{let nameStudent=students().some(s=>s.id===v.studentId);if(!nameStudent){toast('Vui lòng chọn học sinh.',true);return}if(v.score!==''&&(!Number.isFinite(Number(v.score))||Number(v.score)<0||Number(v.score)>10)){toast('Điểm cần từ 0 đến 10.',true);return}let prev=data.learning.find(x=>x.id===ui.editingId);let obj={id:prev?.id||id(),classId:data.selectedClassId,studentId:v.studentId,subject:v.subject,date:v.date,score:v.score===''?'':Number(v.score),level:v.level,note:(v.note||'').trim(),created:prev?.created||new Date().toISOString()};if(prev)Object.assign(prev,obj);else data.learning.push(obj);toast('Đã lưu kết quả học tập.');break}
 case 'reward':{if(!students().some(s=>s.id===v.studentId)){toast('Chọn một học sinh.',true);return}data.rewards.push({id:id(),classId:data.selectedClassId,studentId:v.studentId,date:v.date,points:Number(v.points),reason:v.reason,note:(v.note||'').trim()});toast('Đã ghi nhận lời khen! 🌟');break}
 case 'task':{let prev=data.tasks.find(x=>x.id===ui.editingId);let obj={id:prev?.id||id(),classId:data.selectedClassId,title:(v.title||'').trim(),deadline:v.deadline||'',description:(v.description||'').trim(),done:prev?.done||false};if(!obj.title){toast('Cần có tên nhiệm vụ.',true);return}if(prev)Object.assign(prev,obj);else data.tasks.push(obj);toast('Đã lưu nhiệm vụ.');break}
 case 'subjects':{let list=[...new Set((v.subjects||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];let history=[...new Set(data.learning.filter(r=>r.classId===data.selectedClassId).map(r=>r.subject))];for(const subj of history)if(!list.includes(subj))list.push(subj);if(!list.length){toast('Cần ít nhất một môn học.',true);return}current().subjects=list;ui.learningSubject='Tất cả môn';toast('Đã cập nhật danh sách môn học.');break}
 }
 save();ui.modal=null;ui.editingId=null;ui.modalStudent=null;render()}
function deleteRow(kind,rowId){const names={deleteClass:'lớp học và toàn bộ dữ liệu của lớp',deleteStudent:'học sinh và mọi dữ liệu của học sinh',deleteLearning:'bản ghi đánh giá',deleteReward:'lượt khen thưởng',deleteTask:'nhiệm vụ'};if(!confirm('Cô có chắc muốn xóa '+names[kind]+' này? Thao tác không thể hoàn tác.'))return;
 if(kind==='deleteClass'){data.classes=data.classes.filter(x=>x.id!==rowId);data.students=data.students.filter(x=>x.classId!==rowId);data.attendance=data.attendance.filter(x=>x.classId!==rowId);data.learning=data.learning.filter(x=>x.classId!==rowId);data.rewards=data.rewards.filter(x=>x.classId!==rowId);data.tasks=data.tasks.filter(x=>x.classId!==rowId);delete data.schedules[rowId];delete data.called[rowId];if(data.selectedClassId===rowId)data.selectedClassId=data.classes[0]?.id||null}
 if(kind==='deleteStudent'){data.students=data.students.filter(x=>x.id!==rowId);data.attendance=data.attendance.filter(x=>x.studentId!==rowId);data.learning=data.learning.filter(x=>x.studentId!==rowId);data.rewards=data.rewards.filter(x=>x.studentId!==rowId);Object.keys(data.called).forEach(k=>data.called[k]=data.called[k].filter(x=>x!==rowId))}
 if(kind==='deleteLearning')data.learning=data.learning.filter(x=>x.id!==rowId);
 if(kind==='deleteReward')data.rewards=data.rewards.filter(x=>x.id!==rowId);
 if(kind==='deleteTask')data.tasks=data.tasks.filter(x=>x.id!==rowId);
 save();toast('Đã xóa dữ liệu.');render()}
function randomIndex(len){if(typeof crypto!=='undefined'&&crypto.getRandomValues){const buf=new Uint32Array(1);let limit=Math.floor(4294967296/len)*len;do{crypto.getRandomValues(buf)}while(buf[0]>=limit);return buf[0]%len}return Math.floor(Math.random()*len)}
function startPick(){if(ui.pickerBusy)return;let arr=eligibleStudents();if(!arr.length){toast('Không còn học sinh phù hợp. Hãy làm mới lượt gọi.',true);return}ui.pickerBusy=true;let display=document.getElementById('pickerDisplay'),stage=document.getElementById('pickerStage'),btn=document.getElementById('pickButton'),prompt=document.getElementById('pickerPrompt');btn.disabled=true;stage.classList.add('spinning');prompt.textContent='Đang chọn tên thật ngẫu nhiên...';let cycle=0;let spin=setInterval(()=>{if(!document.contains(display)){clearInterval(spin);ui.pickerBusy=false;return}display.textContent=arr[randomIndex(arr.length)].name;cycle++;if(cycle>=25){clearInterval(spin);let selected=arr[randomIndex(arr.length)];display.textContent='🎉 '+selected.name+' 🎉';prompt.textContent='Mời em tham gia hoạt động!';stage.classList.remove('spinning');ui.pickerBusy=false;if(ui.pickerUnique){if(!data.called[data.selectedClassId])data.called[data.selectedClassId]=[];data.called[data.selectedClassId].push(selected.id);save()}btn.disabled=false;toast('Bạn được mời: '+selected.name);const right=document.querySelector('.grid.g2 .card:nth-child(2)');if(right){let called=data.called[data.selectedClassId]||[];right.querySelector('.picked-list,.empty')?.remove();let wrap=document.createElement('div');wrap.className='picked-list';wrap.innerHTML=called.map((sid,i)=>{let s=data.students.find(x=>x.id===sid);return s?`<span class="picked-chip">${i+1}. ${esc(s.name)}</span>`:''}).join('');right.querySelector('.section-head')?.after(wrap);let tag=right.querySelector('.section-head .tag');if(tag)tag.textContent=called.length+' lượt không trùng'}const remain=eligibleStudents().length;document.querySelector('.card .section-head .tag.purple')?.replaceChildren(document.createTextNode(remain+' học sinh có thể được gọi'));if(remain===0&&ui.pickerUnique)btn.disabled=true}},65)}
function action(name,el){const key=el.dataset.id;switch(name){case 'menu':ui.menuOpen=!ui.menuOpen;render();break;
 case 'selectClass':data.selectedClassId=key;ui.page='dashboard';ui.learningSubject='Tất cả môn';ui.studentSearch='';ui.pickerGroup='Tất cả tổ';save();render();break;
 case 'deleteClass':case 'deleteStudent':case 'deleteLearning':case 'deleteReward':case 'deleteTask':deleteRow(name,key);break;
 case 'markAllPresent':{let day=ui.attendanceDate;for(let s of students()){let row=data.attendance.find(a=>a.classId===data.selectedClassId&&a.studentId===s.id&&a.date===day);if(row)row.status='P';else data.attendance.push({id:id(),classId:data.selectedClassId,studentId:s.id,date:day,status:'P'})}save();toast('Đã đánh dấu tất cả có mặt.');render();break}
 case 'subjectOnly':ui.learningSubject=el.dataset.subject;render();break;
 case 'resetPicker':if(!confirm('Bắt đầu lượt gọi mới và cho phép gọi lại các bạn từ đầu?'))return;data.called[data.selectedClassId]=[];save();ui.pickerBusy=false;render();break;
 case 'pick':startPick();break;
 case 'uploadCover':document.getElementById('coverUploadInput').click();break;
 case 'removeCover':if(confirm('Gỡ ảnh bìa hiện tại và trở về hình minh họa mặc định?')){data.coverImage=null;save();render();toast('Đã gỡ ảnh bìa.')}break;
 case 'backup':exportData();break;
 case 'downloadStudents':downloadCsv(`Danh_sach_${filenamePiece(current().name)}.csv`,['STT','Họ tên','Tổ','Chức vụ','Giới tính','Ngày sinh','Ghi chú'],students().map((s,i)=>[i+1,s.name,s.group,s.role,s.gender,s.dob,s.note]));break;
 case 'downloadAttendance':downloadCsv(`Chuyen_can_${filenamePiece(current().name)}_${ui.attendanceDate}.csv`,['Ngày','Họ tên','Tổ','Trạng thái'],students().map(s=>[ui.attendanceDate,s.name,s.group,({P:'Có mặt',E:'Nghỉ có phép',A:'Nghỉ không phép'})[attStatus(s.id)]||'Chưa đánh dấu']));break;
 case 'downloadLearning':{let subj=ui.learningSubject;const records=data.learning.filter(x=>x.classId===data.selectedClassId&&(subj==='Tất cả môn'||x.subject===subj)).sort((a,b)=>a.date.localeCompare(b.date));downloadCsv(`Ket_qua_mon_${filenamePiece(subj)}_${filenamePiece(current().name)}.csv`,['Ngày','Học sinh','Tổ','Môn','Mức độ','Điểm','Nhận xét'],records.map(x=>{let s=data.students.find(y=>y.id===x.studentId);return[x.date,s?.name||'',s?.group||'',x.subject,LEVELS[x.level]||'',x.score,x.note]}));break}
 case 'print':window.print();break;
 case 'generateSuggestion':ui.assistantText=assistantText();render();toast('Đã tạo gợi ý từ dữ liệu lớp.');break;
 case 'copySuggestion':{let s=document.getElementById('suggestionBox')?.textContent||assistantText();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast('Đã sao chép nội dung.')).catch(()=>fallbackCopy(s));else fallbackCopy(s);break}
 }}
function fallbackCopy(s){let t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('Đã sao chép nội dung.')}
// Event delegation preserves behavior across section renders.
document.addEventListener('click',e=>{if(e.target.id==='modalBack'){closeModal();return}let close=e.target.closest('[data-close]');if(close){closeModal();return}let b=e.target.closest('[data-page]');if(b){ui.page=b.dataset.page;ui.menuOpen=false;ui.modal=null;ui.pickerBusy=false;ui.assistantText='';render();return}let m=e.target.closest('[data-modal]');if(m){modal(m.dataset.modal,m.dataset.id||null,m.dataset.student||null);return}let a=e.target.closest('[data-action]');if(a){action(a.dataset.action,a);return}let att=e.target.closest('[data-att]');if(att){let status=att.dataset.att,studentId=att.dataset.id;let a=data.attendance.find(x=>x.classId===data.selectedClassId&&x.studentId===studentId&&x.date===ui.attendanceDate);if(a){if(a.status===status)data.attendance=data.attendance.filter(x=>x!==a);else a.status=status}else data.attendance.push({id:id(),classId:data.selectedClassId,studentId,date:ui.attendanceDate,status});save();render()}});
document.addEventListener('submit',e=>{let f=e.target.closest('form[data-form]');if(f){e.preventDefault();handleSubmit(f)}});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='classSelect'){data.selectedClassId=x.value||null;ui.page=x.value?'dashboard':'classes';ui.learningSubject='Tất cả môn';ui.studentSearch='';ui.pickerGroup='Tất cả tổ';ui.assistantText='';save();render();return}if(x.id==='attendanceDate'){ui.attendanceDate=x.value;render();return}if(x.id==='learningSubject'){ui.learningSubject=x.value;render();return}if(x.id==='pickerGroup'){ui.pickerGroup=x.value;render();return}if(x.id==='pickerUnique'){ui.pickerUnique=x.checked;render();return}if(x.id==='helpMode'){ui.helpMode=x.value;ui.assistantText='';render();return}if(x.id==='assistantStudent'){ui.assistantStudent=x.value;ui.assistantText='';render();return}if(x.dataset.schedule){if(!data.schedules[data.selectedClassId])data.schedules[data.selectedClassId]={};data.schedules[data.selectedClassId][x.dataset.schedule]=x.value;save();toast('Đã lưu thời khóa biểu.');return}if(x.dataset.taskCheck){let row=data.tasks.find(z=>z.id===x.dataset.taskCheck);if(row){row.done=x.checked;save();render()}return}if(x.id==='restoreFile'){let file=x.files?.[0];if(!file)return;file.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v.classes)||!Array.isArray(v.students)||!Array.isArray(v.attendance)||!Array.isArray(v.learning)||!Array.isArray(v.rewards)||!Array.isArray(v.tasks))throw Error('Tệp không đúng định dạng.');if(!confirm('Phục hồi bản sao lưu sẽ THAY THẾ toàn bộ dữ liệu đang có trên trình duyệt. Cô muốn tiếp tục?'))return;data={...defaults(),...v};data.selectedClassId=data.classes.some(c=>c.id===data.selectedClassId)?data.selectedClassId:data.classes[0]?.id||null;save();ui.modal=null;ui.page='dashboard';render();toast('Đã phục hồi dữ liệu thành công.')}catch(err){toast('Không thể đọc bản sao lưu hợp lệ.',true)}}).catch(()=>toast('Không mở được tệp.',true));return}});
document.addEventListener('input',e=>{if(e.target.id==='studentSearch'){ui.studentSearch=e.target.value;const focusedStart=e.target.selectionStart;render();const inp=document.getElementById('studentSearch');if(inp){inp.focus();inp.setSelectionRange(focusedStart,focusedStart)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){closeModal()}});

// Tự động thu nhỏ kích thước ảnh khi lưu vào máy; giữ nguyên tỉ lệ và không làm biến dạng.
async function setCoverFromFile(file){
 if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast('Vui lòng chọn ảnh JPG, PNG hoặc WebP.',true);return}
 try{
  const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Không đọc được tệp'));r.readAsDataURL(file)});
  const pic=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Ảnh không hợp lệ'));img.src=src});
  const scale=Math.min(1,2100/Math.max(pic.naturalWidth,pic.naturalHeight));const w=Math.max(1,Math.round(pic.naturalWidth*scale)),h=Math.max(1,Math.round(pic.naturalHeight*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Trình duyệt chưa hỗ trợ xử lí ảnh');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(pic,0,0,w,h);
  let last=data.coverImage;let success=false;
  for(const q of [.9,.8,.7,.58]){const val=canvas.toDataURL('image/jpeg',q);data.coverImage=val;try{localStorage.setItem(STORAGE,JSON.stringify(data));success=true;break}catch(e){}}
  if(!success){data.coverImage=last;toast('Không đủ bộ nhớ để lưu ảnh. Hãy chọn ảnh dung lượng nhỏ hơn, hoặc sao lưu dữ liệu trước.',true);return}
  render();toast('Đã đặt ảnh bìa. Ảnh hiển thị đúng tỉ lệ và được lưu trên trình duyệt.');
 }catch(err){toast('Không thể mở ảnh này: '+(err?.message||'Lỗi không xác định'),true)}
}
document.getElementById('coverUploadInput').addEventListener('change',async function(evt){const file=evt.target.files?.[0];evt.target.value='';await setCoverFromFile(file)});
// Dán hình đã sao chép từ cuộc trò chuyện (Ctrl+V) khi không nhập liệu.
document.addEventListener('paste',e=>{
 const tag=e.target?.tagName;
 if(tag==='TEXTAREA'||tag==='INPUT'||e.target?.isContentEditable)return;
 const imageFile=Array.from(e.clipboardData?.items||[]).find(item=>item.kind==='file'&&item.type.startsWith('image/'))?.getAsFile();
 if(imageFile){e.preventDefault();setCoverFromFile(imageFile)}
});
// Kéo thả ảnh trực tiếp lên khung ảnh bìa.
document.addEventListener('dragover',e=>{const zone=e.target.closest?.('#coverDropZone');if(zone){e.preventDefault();zone.classList.add('dragging')}});
document.addEventListener('dragleave',e=>{const zone=e.target.closest?.('#coverDropZone');if(zone&&!zone.contains(e.relatedTarget))zone.classList.remove('dragging')});
document.addEventListener('drop',e=>{const zone=e.target.closest?.('#coverDropZone');if(zone){e.preventDefault();zone.classList.remove('dragging');setCoverFromFile(Array.from(e.dataTransfer?.files||[]).find(f=>f.type.startsWith('image/')))}});


if(data.classes.length&&!current())data.selectedClassId=data.classes[0].id;
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
